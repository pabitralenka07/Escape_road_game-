<!DOCTYPE html>
<html lang="en-us">
<head>
  <base href="https://cdn.jsdelivr.net/gh/abisdbest/classroom.google.com@45b2d69c626dc365753f6922d2c48c4075683ef5/drive.google.com/escape%20road/">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escape Road</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <style>
    @font-face {
      font-family: myFirstFont;
      src: url(Chainwhacks.otf);
    }
    #logo-canvas, body {
      font-family: myFirstFont, sans-serif;
    }
  </style>
</head>
<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <p style="opacity: 0;position: absolute;">_</p>
    <canvas id="unity-canvas"></canvas>
  </div>

  <div id="loading-cover" style="display:none;background: black;">
    <div style="display:none;">
      <img src="loading.png" id="ld_bg" alt="loading background">
      <img src="car-icon.png" id="ld_car" alt="loading car">
    </div>
    <div id="unity-loading-bar">
      <canvas id="logo-canvas" style="position: absolute; background-color: black;"></canvas>
    </div>
  </div>

  <img id="azlogo" class="az" src="az_logo.png" style="display:none;">

  <script>
    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");

    const buildUrl = "https://cdn.jsdelivr.net/gh/abisdbest/classroom.google.com@45b2d69c626dc365753f6922d2c48c4075683ef5/drive.google.com/escape%20road/TemplateData";
    const loaderUrl = buildUrl + "/loader.js";
    const config = {
      dataUrl: buildUrl + "/data.unityweb",
      frameworkUrl: buildUrl + "/framework.js.unityweb",
      codeUrl: buildUrl + "/wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "1games.io",
      productName: "Escape Road",
      productVersion: "2.0",
    };

    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      container.className = "unity-mobile";
      config.devicePixelRatio = 1;
    }

    var logo_loaded = false;
    var logo_loading_percent = 0;
    var logo_canvas = document.getElementById("logo-canvas");

    function resizeLogoCanvas() {
      var _w = window.innerWidth;
      var _h = window.innerHeight;
      var _nw = (_h * 16) / 9;
      if (_nw <= _w) {
        logo_canvas.width = _nw;
        logo_canvas.height = _h;
      } else {
        logo_canvas.width = _w;
        logo_canvas.height = (_w * 9) / 16;
      }
    }

    function drawCanvas(_percent = 0) {
      if (logo_loaded) {
        return;
      }
      resizeLogoCanvas();
      var ctx = logo_canvas.getContext("2d");
      var ld_bg = document.getElementById("ld_bg");
      var ld_car = document.getElementById("ld_car");

      var _sw = logo_canvas.width / 1920;
      var _sh = logo_canvas.height / 1080;

      if (_percent > 1) {
        _percent = 1;
      }

      // Background
      if (ld_bg && ld_bg.complete && ld_bg.naturalWidth > 0) {
        ctx.drawImage(ld_bg, 0, 0, logo_canvas.width, logo_canvas.height);
      } else {
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, logo_canvas.width, logo_canvas.height);
      }

      // Loading background bar
      ctx.fillStyle = "#977e21";
      var _lw = 700;
      var _lh = 50;
      ctx.fillRect((1920 - _lw) * 0.5 * _sw, (1080 - 150) * _sh, _lw * _sw, _lh * _sh);

      // Loading progress fill
      ctx.fillStyle = "#fad234";
      var _pad = 5;
      var _pw = _lw - _pad * 2;
      var _ph = _lh - _pad * 2;
      var _px = (1920 - _pw) * 0.5;
      ctx.fillRect(_px * _sw, (1080 - 150 + _pad) * _sh, _pw * _percent * _sw, _ph * _sh);

      // Car indicator on loading bar
      if (ld_car && ld_car.complete && ld_car.naturalWidth > 0) {
        var _car_x = _px + _pw * _percent - 100;
        if (_car_x < _px) {
          _car_x = _px;
        }
        ctx.drawImage(ld_car, _car_x * _sw, (1080 - 190) * _sh, 100 * _sw, 42 * _sh);
      }

      // Percentage text
      ctx.font = `bold ${Math.max(16, Math.floor(35 * _sh))}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillStyle = "#fff";
      ctx.shadowColor = "black";
      ctx.shadowOffsetY = 2;
      var new_per = parseInt(_percent * 100);
      ctx.fillText("" + new_per + "%", logo_canvas.width / 2, logo_canvas.height / 2 + _sh * 425);
    }

    window.onresize = () => {
      drawCanvas(logo_loading_percent);
    };
    window.onload = () => {
      drawCanvas(logo_loading_percent);
    };

    async function load() {
      var az_logo = document.getElementById('azlogo');
      if (az_logo) az_logo.style.display = 'none';
      logo_loaded = false;

      createUnityInstance(canvas, config, (progress) => {
        logo_loading_percent = progress;
        drawCanvas(progress);
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        setTimeout(() => {
          loadingCover.style.display = "none";
          logo_loaded = true;
          window.focus();
        }, 1500);
      }).catch((message) => {
        alert(message);
      });
    }

    loadingCover.style.display = "";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      load();
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
